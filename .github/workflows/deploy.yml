name: Deploy

on:
  push:
    branches: [main]
  # Release data is fetched at build time, so rebuild when new releases may exist. The icpctools and
  # team-view release workflows can also trigger an immediate rebuild with a repository_dispatch event.
  schedule:
    - cron: '17 0 * * *'
  repository_dispatch:
    types: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.1.2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Fetch release data
        run: pnpm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec vite build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
